<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KairosAdmin</title>
  <link rel="stylesheet" href="/KairosAdmin/assets/app.css">
</head>
<body>
  <main class="shell">
    <header class="topbar"><div><p class="eyebrow">KAIROS CONTROL PLANE</p><h1>KairosAdmin</h1></div><button id="logout" class="quiet hidden">退出</button></header>
    <section id="login-panel" class="panel login-panel">
      <p class="eyebrow">SECURE ACCESS</p><h2>登录管理后台</h2>
      <form id="login-form"><label>账号<input name="username" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">登录</button><p id="login-error" class="error" role="alert"></p></form>
    </section>
    <section id="app-panel" class="hidden">
      <div class="summary"><div><span class="label">当前管理员</span><strong id="identity"></strong></div><div><span class="label">角色</span><strong id="role"></strong></div></div>
      <nav class="tabs"><button data-tab="groups" class="active">群组与花名册</button><button data-tab="users" id="users-tab">服务器账号</button></nav>
      <section id="groups-view" class="view"><div class="view-head"><div><p class="eyebrow">GROUPS</p><h2>群组目录</h2></div><button id="refresh-groups" class="quiet">刷新</button></div><div id="groups" class="list"></div><p id="group-error" class="error"></p></section>
      <section id="users-view" class="view hidden"><div class="view-head"><div><p class="eyebrow">DIRECTORY</p><h2>服务器账号</h2></div><button id="refresh-users" class="quiet">刷新</button></div><div id="users" class="list"></div><p id="user-error" class="error"></p></section>
    </section>
  </main>
  <script src="/KairosAdmin/assets/app.js" defer></script>
</body>
</html>
